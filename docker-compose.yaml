# HSHQManaged ivbox v2

services:
  ivbox-app:
    image: hshq/ivbox:v2
    container_name: ivbox-app
    hostname: ivbox-app
    restart: unless-stopped
    env_file: stack.env
    security_opt:
      - seccomp=unconfined
      - label=disable
    cap_add:
      - SYS_PTRACE
    ipc: host
    devices:
      - /dev/dri
      - /dev/kfd
    group_add:
      - video
      - render
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 96G
    ports:
      - 9642:8188
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /usr/share/ca-certificates:/usr/share/ca-certificates:ro
      - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro
      - ./comfyui:/comfyui
      - ./comfyui-models:/comfyui/models
      - ./hf-cache:/root/.cache/huggingface
